[messages."cli.presentationOptions"]
text = "Apresentação global: --interactive  --color auto|always|never  --messageFormat human|json\nDiagnósticos globais: --warningWave <number|Latest>  --warningsAsErrors <*|WarningGroup|POP####>  --disabledWarnings <*|WarningGroup|POP####>  --maximumErrors <1..10000>\nResolução de Pacotes: --locked  --offline  --frozen  --registryRoot <diretório>"

[messages."cli.usage"]
text = "Uso:\n    pop new <caminho> [--name <Package.Name>] [--library|--binary]\n    pop initialize [caminho] [--name <Package.Name>] [--library|--binary]\n    pop check <fonte.pop> [--dump <hir|mir|ll>]...\n    pop check --manifestPath <bubble.toml> [--feature <camelCase>] [--platformTarget <triple>]\n    pop lint --manifestPath <bubble.toml> [--feature <camelCase>] [--platformTarget <triple>]\n    pop format --manifestPath <bubble.toml> [--check]\n    pop fix <fonte.pop>\n    pop fix --manifestPath <bubble.toml>\n    pop build <fonte.pop> --output <executável>\n    pop build --manifestPath <bubble.toml> [--feature <camelCase>] [--platformTarget <triple>]\n    pop build --manifestPath <bubble.toml> --example <BubbleName>\n    pop test --manifestPath <bubble.toml> [--feature <camelCase>] [--platformTarget <triple>]\n    pop benchmark --manifestPath <bubble.toml> [--feature <camelCase>] [--platformTarget <triple>]\n    pop documentation --manifestPath <bubble.toml>\n    pop transpile <fonte.pop> --to c\n    pop run <fonte.pop> [-- <argumentos>...]\n    pop run --manifestPath <bubble.toml> [--feature <camelCase>] [--platformTarget <triple>] [-- <argumentos>...]\n    pop ffi generate <alias> --manifestPath <bubble.toml> --platformTarget <triple>\n\nO caminho direto para o arquivo-fonte é um modo bootstrap de inspeção do compilador. Ele verifica um Module em uma Bubble efêmera e não define identidade de Package nem de Bubble. Os dumps de IR são texto de depuração determinístico para esta versão do compilador, não formatos de serialização estáveis."
