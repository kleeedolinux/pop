[messages."cli.presentationOptions"]
text = "全局显示选项: --interactive  --color auto|always|never  --messageFormat human|json\n全局诊断: --warningWave <number|Latest>  --warningsAsErrors <*|WarningGroup|POP####>  --disabledWarnings <*|WarningGroup|POP####>  --maximumErrors <1..10000>\n包解析: --locked  --offline  --frozen  --registryRoot <目录>"

[messages."cli.usage"]
text = "用法:\n    pop new <path> [--name <Package.Name>] [--library|--binary]\n    pop initialize [path] [--name <Package.Name>] [--library|--binary]\n    pop check <source.pop> [--dump <hir|mir|ll>]...\n    pop check --manifestPath <bubble.toml> [--feature <camelCase>] [--platformTarget <triple>]\n    pop lint --manifestPath <bubble.toml> [--feature <camelCase>] [--platformTarget <triple>]\n    pop format --manifestPath <bubble.toml> [--check]\n    pop fix <source.pop>\n    pop fix --manifestPath <bubble.toml>\n    pop build <source.pop> --output <executable>\n    pop build --manifestPath <bubble.toml> [--feature <camelCase>] [--platformTarget <triple>]\n    pop build --manifestPath <bubble.toml> --example <BubbleName>\n    pop test --manifestPath <bubble.toml> [--feature <camelCase>] [--platformTarget <triple>]\n    pop benchmark --manifestPath <bubble.toml> [--feature <camelCase>] [--platformTarget <triple>]\n    pop documentation --manifestPath <bubble.toml>\n    pop transpile <source.pop> --to c\n    pop run <source.pop> [-- <arguments>...]\n    pop run --manifestPath <bubble.toml> [--feature <camelCase>] [--platformTarget <triple>] [-- <arguments>...]\n    pop ffi generate <alias> --manifestPath <bubble.toml> --platformTarget <triple>\n\n直接指定源文件路径是编译器的引导检查模式。它检查临时 Bubble 中的一个 Module，不定义 Package 或 Bubble 标识。IR 转储是针对当前编译器版本的确定性调试文本，并非稳定的序列化格式。"
